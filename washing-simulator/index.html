<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BESPOKE AI 콤보 7인치 LCD 시뮬레이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pg:#E3E5E1;--ink:#20252A;--ink2:#58616A;--panel:#F2F3F0;--panel2:#E9EBE7;--line:#C6CBC4;--blu:#2E6BD8;--red:#C73A3A;--ok:#23845A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#191D20;--ink:#E4E8EB;--ink2:#9AA3AB;--panel:#22272B;--panel2:#2A3035;--line:#394047;--blu:#78A6FF;--red:#FF7A7A;--ok:#5ACB91}}
:root[data-theme="dark"]{--pg:#191D20;--ink:#E4E8EB;--ink2:#9AA3AB;--panel:#22272B;--panel2:#2A3035;--line:#394047;--blu:#78A6FF;--red:#FF7A7A;--ok:#5ACB91}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--pg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.top{max-width:1180px;margin:0 auto;padding:18px 20px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.top p{margin:2px 0 0;color:var(--ink2);font-size:16px}
.rot{display:none;margin:0 20px 8px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;color:var(--ink2);font-size:16px}
@media (orientation:portrait) and (max-width:700px){.rot{display:block}}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 120px}
#stagewrap{position:relative;width:100%;margin:6px 0 22px}
#device{position:absolute;left:50%;top:0;width:1124px;height:640px;margin-left:-562px;transform-origin:top center;border-radius:30px;background:linear-gradient(160deg,#1c2024,#07090b 55%,#121518);box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 24px 50px -20px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.3)}
.pwz{position:absolute;left:0;top:0;width:88px;height:640px;display:flex;align-items:center;justify-content:center}
#pwr{width:62px;height:62px;border-radius:50%;border:2px solid #3a4046;background:radial-gradient(circle at 50% 40%,#23282d,#101316);display:flex;align-items:center;justify-content:center;touch-action:none}
#pwr svg{width:30px;height:30px;stroke:#9aa3ab;fill:none;stroke-width:2.4;stroke-linecap:round}
#pwr.on svg{stroke:#e9f1ff;filter:drop-shadow(0 0 6px #5c9dff)}
#pwr.hold{box-shadow:0 0 0 4px rgba(92,157,255,.35)}
.pwz small{position:absolute;bottom:26px;color:#5d656d;font-size:13px}

/* ---------- 7인치 화면 ---------- */
#scr{position:absolute;left:88px;top:20px;width:1024px;height:600px;background:#000;border-radius:8px;overflow:hidden;color:#F1F3F6;font-size:24px;line-height:1.35;--fs:1;user-select:none;-webkit-user-select:none;touch-action:none}
#scr *{box-sizing:border-box}
:where(#scr) button{background:none;border:0;padding:0;color:inherit;font-size:inherit;line-height:1.25}
#scr{word-break:keep-all;overflow-wrap:anywhere}
#scr .dim{color:#9AA3AE}
#scrin{position:absolute;inset:0;transition:transform .35s ease}
#scr.reach #scrin{transform:translateY(240px)}
.sb{position:absolute;left:0;right:0;top:0;height:52px;display:flex;align-items:center;padding:0 18px 0 26px;gap:16px;font-size:calc(21px*var(--fs));z-index:5}
.sb .clk{font-weight:500;letter-spacing:.01em}
.sb .ic{margin-left:auto;display:flex;gap:14px;align-items:center}
.sb .ic svg{width:24px;height:24px;fill:none;stroke:#DDE3EA;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sb .home{width:52px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.sb .home svg{width:28px;height:28px;fill:#fff;stroke:none}
.sb .tmr{font-size:calc(18px*var(--fs));color:#9EC4FF}
#main{position:absolute;left:0;right:0;top:52px;bottom:0}
.card{background:#1C1F24;border-radius:26px}
.lf{display:inline-block;width:.8em;height:.8em;margin-left:.3em;vertical-align:-.05em}
.lf path{fill:#4CC38A}
/* 홈 */
.home-g{position:absolute;inset:8px 24px 30px;display:grid;grid-template-columns:584px 1fr;gap:20px}
.qc{position:relative;height:350px;padding:30px 32px;text-align:left;display:flex;flex-direction:column;background:#1C1F24;border-radius:30px;width:100%}
.qc .t1{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;padding-right:4px;font-size:calc(38px*var(--fs));font-weight:600}
.chip{white-space:nowrap;flex:none;font-size:calc(19px*var(--fs));font-weight:500;padding:4px 14px;border-radius:99px;background:#2B3038;color:#C9D3DE}
.qc .t2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:10px;color:#A5AFBA;font-size:calc(22px*var(--fs))}
.qc .t3{margin-top:auto}
.qc .t3{padding-right:104px}.qc .t3 b{line-height:1.1;white-space:nowrap;display:block;font-size:calc(52px*var(--fs));font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qc .t3 small{display:block;color:#9AA3AE;font-size:calc(19px*var(--fs))}
.play{position:absolute;right:28px;bottom:28px;width:96px;height:96px;border-radius:50%;background:#3D8BFF !important;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px -8px rgba(61,139,255,.8)}
.play svg{width:40px;height:40px;fill:#fff}
.play.pz{background:#2B3038 !important;box-shadow:none}
.hrow{display:flex;gap:16px;margin-top:18px;align-items:center}
.round{width:88px;height:88px;border-radius:50%;background:#1C1F24 !important;display:flex;align-items:center;justify-content:center}
.round svg{width:38px;height:38px;fill:none;stroke:#DDE3EA;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.round[disabled]{opacity:.35}
.pill{white-space:nowrap;flex:none;height:88px;padding:0 38px;border-radius:44px;background:#1C1F24 !important;font-size:calc(25px*var(--fs));font-weight:500}
.handle{position:absolute;left:50%;bottom:8px;width:150px;height:22px;margin-left:-75px;display:flex;align-items:center;justify-content:center}
.handle::after{content:"";width:110px;height:6px;border-radius:3px;background:#5A626C}
/* 위젯 */
.wg{height:456px;overflow:hidden;padding:26px 28px;display:flex;flex-direction:column;text-align:left;width:100%;background:#1C1F24;border-radius:30px;position:relative}
.wg h3{margin:0 0 14px;font-size:calc(25px*var(--fs));font-weight:600}
.wg .dots{position:absolute;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:8px}
.wg .dots i{width:9px;height:9px;border-radius:50%;background:#48505a}
.wg .dots i.on{background:#EAF0F7}
.tank{flex:1;min-height:0;display:flex;gap:16px;align-items:stretch;margin-bottom:14px}
.tk{flex:1}
.tk{display:flex;flex-direction:column;min-width:0}.tk .bar{flex:1;min-height:60px;max-height:150px;border-radius:18px;background:#2A2F36;position:relative;overflow:hidden}
.tk .bar i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#6FB0FF,#3D8BFF)}
.tk .bar i.sf{background:linear-gradient(#C8A8FF,#9269E8)}
.tk .bar i.low{background:linear-gradient(#FFC266,#FF9A2E)}
.tk .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:8px;font-size:calc(20px*var(--fs));font-weight:500}
.tk .sm{font-size:calc(18px*var(--fs));color:#9AA3AE}
.alert{margin-top:auto;padding:12px 16px;border-radius:16px;background:#3A2A12;color:#FFCF85;font-size:calc(19px*var(--fs))}
.bars{display:flex;gap:10px;align-items:flex-end;flex:1;min-height:60px;max-height:150px;margin-bottom:22px;margin-top:10px}
.bars i{flex:1;background:#3D8BFF;border-radius:6px 6px 2px 2px;min-height:4px}
.bars.w i{background:#4FB6C9}
.big{font-size:calc(52px*var(--fs));font-weight:500;letter-spacing:-.02em}
.wbtn{display:flex;gap:12px;margin-top:auto}
.wbtn button,.btn{white-space:nowrap;flex:none;min-width:112px;height:64px;padding:0 28px;border-radius:32px;background:#2B3038 !important;font-size:calc(21px*var(--fs));font-weight:500}
.btn.p{background:#3D8BFF !important}
.btn.r{background:#5A2328 !important;color:#FFC4C4}
.btn[disabled]{opacity:.35}
/* 공통 페이지 */
.pg{position:absolute;inset:0;padding:6px 28px 20px;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;height:62px;flex:none}
.ph .bk{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ph .bk svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2.6}
.ph h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0;font-size:calc(30px*var(--fs));font-weight:600}
.ph .rt{margin-left:auto;display:flex;gap:10px;align-items:center}
.scroll{overflow-y:auto;flex:1;min-height:0;scrollbar-width:none;touch-action:pan-y}
.scroll::-webkit-scrollbar{display:none}
/* 코스 목록 */
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:20px}
.ct{min-height:128px;gap:6px;border-radius:24px;background:#1C1F24 !important;padding:18px 20px !important;text-align:left;display:flex;flex-direction:column}
.ct.on{box-shadow:0 0 0 3px #3D8BFF inset}
.ct b{line-height:1.2;font-size:calc(23px*var(--fs));font-weight:600}
.ct span{line-height:1.25;margin-top:auto;font-size:calc(18px*var(--fs));color:#9AA3AE}
.sec{font-size:calc(19px*var(--fs));color:#9AA3AE;margin:4px 4px 12px}
.rec{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.rec button{white-space:nowrap;height:60px;padding:0 22px;border-radius:30px;background:#16263D !important;color:#A9CBFF;font-size:calc(20px*var(--fs))}
/* 코스 설정 */
.su-h{display:flex;align-items:center;gap:16px;height:60px}
.su-h .nm{min-width:0;overflow:hidden;font-size:calc(32px*var(--fs));font-weight:600;display:flex;align-items:center;gap:8px;height:60px;padding:0 20px;border-radius:30px;background:#1C1F24 !important;flex:1;justify-content:flex-start}
.su-h .nm .nmt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.su-h .nm i{white-space:nowrap;flex:none;padding-left:12px;margin-left:auto;font-style:normal;color:#9AA3AE;font-size:calc(20px*var(--fs))}
.seg{display:flex;background:#1C1F24;border-radius:30px;padding:5px;gap:4px;margin-top:12px}
.seg button{white-space:nowrap;min-width:0;flex:1;height:52px;border-radius:26px;font-size:calc(22px*var(--fs));font-weight:500;color:#B8C1CB !important}
.seg button.on{background:#3D8BFF !important;color:#fff !important}
.seg button[disabled]{opacity:.28}
.og{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.oc{min-height:96px;min-width:0;overflow:hidden;border-radius:22px;background:#1C1F24 !important;padding:12px 20px !important;text-align:left;display:flex;flex-direction:column;justify-content:center}
.oc span,.oc b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:1.25}.oc span{font-size:calc(18px*var(--fs));color:#9AA3AE}
.oc b{font-size:calc(26px*var(--fs));font-weight:600}
.oc.lk{opacity:.5}
.note{cursor:pointer;margin-top:10px;font-size:calc(18px*var(--fs));color:#FFCF85;min-height:26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf{display:flex;align-items:center;gap:14px;margin-top:auto}
.sf .round{width:76px;height:76px}
.sf .round svg{width:32px;height:32px}
.sf .tm{margin-left:auto;text-align:right;min-width:0}.sf .tm b,.sf .tm small{white-space:nowrap}
.sf .tm b{display:block;font-size:calc(34px*var(--fs));font-weight:500}
.sf .tm small{color:#9AA3AE;font-size:calc(18px*var(--fs))}
.sf .play{position:static;width:88px;height:88px}
.more{height:96px;border-radius:22px;background:#1C1F24 !important;display:flex;align-items:center;justify-content:center;font-size:32px;letter-spacing:4px}
/* 동작 화면 */
.run{position:absolute;inset:6px 28px 22px;display:grid;grid-template-columns:400px 1fr;gap:26px}
.ring{position:relative;width:400px;height:400px;margin-top:18px}
.ring svg{width:400px;height:400px;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{line-height:1.05;font-size:calc(96px*var(--fs));font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.ring .in span{color:#9AA3AE;font-size:calc(21px*var(--fs));margin-top:6px}
.rr{display:flex;flex-direction:column;padding-top:20px;min-width:0}
.rr .cn{flex-wrap:wrap;line-height:1.2;font-size:calc(34px*var(--fs));font-weight:600;display:flex;align-items:center;gap:12px}
.rr .st{line-height:1.25;font-size:calc(26px*var(--fs));margin-top:8px;color:#8FC0FF}
.rr .st.er{color:#FF8A8A}
.rr .en{font-size:calc(21px*var(--fs));color:#9AA3AE;margin-top:4px}
.stg{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.stg span{white-space:nowrap;padding:6px 16px;border-radius:99px;font-size:calc(19px*var(--fs));background:#1C1F24;color:#7F8995}
.stg span.dn{color:#C7D0DA}
.stg span.cu{background:#3D8BFF;color:#fff}
.ai{margin-top:16px;font-size:calc(19px*var(--fs));color:#BFD7FF;background:#14233A;border-radius:16px;padding:10px 16px}
.rb{display:flex;flex-wrap:nowrap;gap:14px;margin-top:auto;align-items:center}
.rb .play{position:static}
/* 완료 */
.done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 60px}
.done .ck{width:104px;height:104px;border-radius:50%;background:#173A2A;display:flex;align-items:center;justify-content:center}
.done .ck svg{width:56px;height:56px;stroke:#4CC38A;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.done h2{font-size:calc(38px*var(--fs));font-weight:600;margin:20px 0 8px}
.done .stats{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 36px;margin:10px 0 6px}
.done .stats div{font-size:calc(19px*var(--fs));color:#9AA3AE}
.done .stats b{display:block;font-size:calc(34px*var(--fs));color:#fff;font-weight:500}
.done p{margin:6px 0;color:#C6CED8;font-size:calc(21px*var(--fs))}
/* 설정 */
.st-g{flex:1;min-height:0;display:grid;grid-template-columns:300px 1fr;gap:20px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav .tb{display:flex;background:#1C1F24;border-radius:24px;padding:4px;margin-bottom:10px}
.nav .tb button{white-space:nowrap;flex:1;height:46px;border-radius:20px;font-size:calc(20px*var(--fs))}
.nav .tb button.on{background:#3D8BFF}
.nav .it{min-height:56px;line-height:1.25;border-radius:16px;text-align:left;padding:0 18px !important;font-size:calc(21px*var(--fs));flex:none}
.nav .it.on{background:#1C1F24 !important;color:#8FC0FF}
.dt{background:#14171B;border-radius:24px;padding:10px 26px}
.row{display:flex;align-items:center;gap:18px;min-height:78px;padding:10px 0;border-bottom:1px solid #262B31}
.row:last-child{border-bottom:0}
.row>div:first-child{flex:1 1 40%;min-width:0}.row>:nth-child(2){flex:0 1 auto;max-width:62%}.rt{line-height:1.25}
.rt{font-size:calc(23px*var(--fs))}
.rs{font-size:calc(18px*var(--fs));color:#9AA3AE;margin-top:2px}
.tg{width:76px;height:42px;border-radius:21px;background:#3A414A !important;position:relative;flex:none}
.tg i{position:absolute;left:5px;top:5px;width:32px;height:32px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:#3D8BFF !important}
.tg.on i{left:39px}
.tg[disabled]{opacity:.35}
.sg{min-width:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sg button{white-space:nowrap;height:48px;padding:0 18px !important;border-radius:24px;background:#262B32 !important;font-size:calc(19px*var(--fs));color:#C2CBD5 !important}
.sg button.on{background:#3D8BFF !important;color:#fff !important}
.rng{width:260px;accent-color:#3D8BFF;height:40px}
.gd{font-size:calc(19px*var(--fs));color:#C6CED8;padding:12px 0}
.gd ol{margin:6px 0;padding-left:28px}
/* 오버레이 */
#ovl{position:absolute;inset:0;z-index:20;pointer-events:none}
#ovl.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.qp{position:absolute;left:0;right:0;top:0;padding:64px 60px 30px;background:#15181C;border-radius:0 0 34px 34px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.qp .tgs{display:flex;justify-content:space-between}
.qp .q{display:flex;flex-direction:column;align-items:center;gap:8px;width:130px}
.qp .q .c{width:84px;height:84px;border-radius:50%;background:#2A2F36;display:flex;align-items:center;justify-content:center}
.qp .q.on .c{background:#3D8BFF}
.qp .q[disabled]{opacity:.35}
.qp .q svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.qp .q span{white-space:nowrap;font-size:calc(18px*var(--fs));color:#C6CED8}
.qp .sl{display:flex;align-items:center;gap:18px;margin-top:22px;font-size:22px}
.qp .sl input{flex:1;accent-color:#3D8BFF;height:44px}
.qp .grip{width:110px;height:6px;border-radius:3px;background:#5A626C;margin:18px auto 0}
.dock{position:absolute;left:120px;right:120px;bottom:16px;background:#1A1D22;border-radius:34px;padding:22px 26px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.dock button{white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:calc(17px*var(--fs));color:#C6CED8 !important}
.dock .ai2{width:72px;height:72px;border-radius:22px;background:#2A2F36;display:flex;align-items:center;justify-content:center;font-size:30px}
.sheet{position:absolute;left:120px;right:120px;bottom:0;max-height:548px;background:#1A1D22;border-radius:32px 32px 0 0;padding:22px 30px 26px;display:flex;flex-direction:column}
.sheet h3{margin:0 0 12px;font-size:calc(28px*var(--fs));font-weight:600}
.sheet .vs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sheet .vs button{white-space:nowrap;height:72px;border-radius:20px;background:#262B32 !important;font-size:calc(23px*var(--fs))}
.sheet .vs button.on{background:#3D8BFF !important}
.sheet .ft{display:flex;gap:12px;justify-content:flex-end;margin-top:16px}
.bx{position:absolute;left:0;right:0;bottom:0;padding:24px 40px 28px;background:linear-gradient(180deg,rgba(10,14,22,.0),#0A0E16 22%);display:flex;flex-direction:column;gap:14px}
.bx .orb{width:70px;height:70px;border-radius:50%;background:conic-gradient(#4E8BFF,#9A6BFF,#3FD0C8,#4E8BFF);animation:spin 3s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.bx .l1{display:flex;gap:20px;align-items:center}
.bx .said{font-size:calc(22px*var(--fs));color:#9AA3AE}
.bx .ans{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:calc(27px*var(--fs));font-weight:500}
.bx .inp{display:flex;gap:10px}
.bx input{flex:1;height:62px;border-radius:31px;border:0;background:#1E232A;color:#fff;font:inherit;font-size:22px;padding:0 24px;user-select:text;-webkit-user-select:text}
.bx .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
.bx .chips button{flex:none;height:48px;padding:0 18px;border-radius:24px;background:#1E232A !important;font-size:calc(18px*var(--fs));color:#C6CED8 !important;white-space:nowrap}

 if(c.id==='care'){if(o.care==='무세제 통세척+'){P('fill','급수',4);P('wash','통세척',48);P('rinse','헹굼',10);P('drain','배수',3)}else{P('dry','열풍 살균',52);P('cool','냉각',8)}return st}

 if(hasW){
  if(!c.noFill){P('sense',c.ai?'무게, 오염도 감지':'무게 감지',2);P('fill','급수',3)}

  if(c.wash)P('wash',c.id==='steril'?'스팀 살균 세탁':'세탁',c.wash+heatMin(o.temp)+(soil?12:0)+(c.ai?kg*1.2:0));
  if(o.rinse){const r=(o.rinse==='꺼짐'?0:+o.rinse)+(soil?1:0);for(let i=0;i<r;i++)st.push({k:'rinse',n:`헹굼 ${i+1}/${r}`,d:480,last:i===r-1})}

 }
 if(hasD){
  let d;if(o.dtime)d=parseInt(o.dtime);else if(c.dur)d=c.dur;else{const f={다림질용:.55,섬세하게:.7,보송하게:.9,뽀송하게:1}[o.dry]||.9;d=26+Math.max(kg,.5)*19*f*(c.dryK||1)}
  P('dry',{fan:'송풍 건조',air:'에어살균',dust:'먼지 털기',pad:'패딩 케어'}[c.id]||'건조',d);
  if(!c.noHeat)P('cool','냉각',8);
 }
 return st;
}

 if(s.k==='rinse'&&s.last&&cy.plan&&cy.plan.soft){const need=doseMl(cy.plan.a.sel,cy.kg,S.det.sel.conc,1);const g=Math.min(need,S.det.sel.ml);S.det.sel.ml-=g;cy.dosed=(cy.dosed||[]).concat(`유연제 ${Math.round(g)} ml`)}

 if(s.k==='wash'&&cy.sel.o.temp&&cy.sel.o.temp!=='냉수')cy.use.kWh+=(14+cy.kg*2)*Math.max(0,+cy.sel.o.temp-15)*0.00116;

 if((s.k==='spin'||s.k==='dspin'||s.k==='drain')&&cy.t>12&&(S.drainClog||S.frozen)){raise('5C');return}

 const c=CO[cy.sel.id],m=cy.sel.mode,o=cy.sel.o;
 cy.use.kWh+=cy.dryMin/60*(c.noHeat?.12:.85)+sumSec(cy.stages)/3600*.08;

function bixby(q){
 q=String(q).trim();S.bx.said=q;const r=t=>{S.bx.ans=t;say(t);if(S.ovl&&S.ovl.t==='bx')renderOvl()};
 if(!S.wifi){r('네트워크에 연결되어 있지 않아 빅스비를 사용할 수 없어요.');return}

 let m=q.match(/(음성안내|고대비|색상반전|흑백|릴루미노|확대)\s*(켜|꺼)/);
 if(m){const key={음성안내:'voice',고대비:'hc',색상반전:'inv',흑백:'gray',릴루미노:'rel',확대:'zoom'}[m[1]];S.set.a11y[key]=m[2]==='켜';applyA11y();r(`${m[1]}을(를) ${m[2]==='켜'?'켰어요':'껐어요'}.`);render();S.ovl={t:'bx'};renderOvl();return}
 if(/날씨/.test(q))return r('내일은 대체로 맑고 낮 최고 26도가 예상돼요. (시뮬레이터 예시 응답)');
 if(/습도/.test(q))return r('오늘 습도는 72%로 높은 편이에요. 세탁+건조를 추천해요. (예시 응답)');
 if(/미세먼지/.test(q))return r('오늘 미세먼지는 보통이에요. (예시 응답)');
 if(/비\s*와|비\s*오/.test(q))return r('목요일 오후에 비 소식이 있어요. (예시 응답)');
 if(/음력/.test(q))return r('지금은 음력 8월이에요.');
 if(/뉴욕/.test(q)){let t;try{t=new Date(S.clock).toLocaleTimeString('ko-KR',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'})}catch(e){t='확인할 수 없어요'}return r(`뉴욕은 지금 ${t}예요.`)}
 if(/남은\s*시간/.test(q))return r(act&&!cy.wait?`남은 시간은 ${fmtDur(remainSec(cy)/60)}이에요.`:'지금 동작 중인 코스가 없어요.');

 if(/전원\s*상태/.test(q))return r(`전원이 ${S.power?'켜져':'꺼져'} 있어요.`);
 if(/상태/.test(q))return r(!S.power?'전원이 꺼져 있어요.':act?(cy.err?`점검 ${cy.err}, ${ERR[cy.err].t}.`:cy.paused?'일시정지 상태예요.':`${cy.task||CO[cy.sel.id].name} 코스, ${curStage().n} 중이에요.`):'대기 중이에요.');
 if(/지원\s*코스/.test(q))return r('지원 코스는 '+COURSES.filter(c=>!c.only||c.only===S.model).map(c=>c.name).join(', ')+'이에요.');
 if(/현재\s*코스/.test(q))return r(`현재 코스는 ${act?(cy.task||CO[cy.sel.id].name):CO[S.sel.id].name}예요.`);
 if(/일시\s*정지/.test(q)){if(act&&!cy.paused){pause();return r('일시정지했어요.')}return r('일시정지할 코스가 없어요.')}
 if(/취소/.test(q)){if(act){stopCycle();return r('코스를 취소했어요.')}return r('취소할 코스가 없어요.')}

 if(/꺼\s*줘|끄기/.test(q)){if(act)return r('동작 중에는 전원을 끌 수 없어요. 먼저 코스를 취소하세요.');powerOff();return r('전원을 껐어요.')}
 if(/켜\s*줘/.test(q)){if(!S.power){powerOn();return r('전원을 켰어요.')}return r('이미 켜져 있어요.')}
 const cn=COURSES.slice().sort((a,b)=>b.name.length-a.name.length).find(c=>(!c.only||c.only===S.model)&&q.replace(/\s/g,'').includes(c.name.replace(/\s/g,'')));

function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function brushTex(){ // 가로 헤어라인
 const c=canvas(1024,256),g=c.getContext('2d');g.fillStyle='#bcbcbc';g.fillRect(0,0,1024,256);
 for(let i=0;i<3200;i++){const y=Math.random()*256,x=Math.random()*1024,l=60+Math.random()*700,a=Math.random()*.12;
  g.fillStyle=Math.random()<.5?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`;const h=.5+Math.random()*.9;g.fillRect(x,y,l,h);g.fillRect(x-1024,y,l,h)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
function embossNormal(){ // 옆판의 둥근 사각 엠보싱 (사진 참고)
 const W=384,H=512,c=canvas(W,H),g=c.getContext('2d');g.fillStyle='#808080';g.fillRect(0,0,W,H);g.filter='blur(4px)';
 const rr=(x,y,w,h,r,lw,col)=>{g.strokeStyle=col;g.lineWidth=lw;g.beginPath();g.roundRect(x,y,w,h,r);g.stroke()};
 rr(26,30,W-52,H-60,46,16,'#c8c8c8');rr(60,72,W-120,H-144,36,12,'#bdbdbd');
 g.fillStyle='#767676';g.beginPath();g.roundRect(86,100,W-172,H-200,28);g.fill();
 const src=g.getImageData(0,0,W,H).data,out=g.createImageData(W,H),o=out.data,h=(x,y)=>src[((Math.min(H-1,Math.max(0,y)))*W+Math.min(W-1,Math.max(0,x)))*4]/255;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=(h(x-1,y)-h(x+1,y))*6,dy=(h(x,y+1)-h(x,y-1))*6,l=Math.hypot(dx,dy,1),i=(y*W+x)*4;
  o[i]=(dx/l*.5+.5)*255;o[i+1]=(dy/l*.5+.5)*255;o[i+2]=(1/l*.5+.5)*255;o[i+3]=255}
 g.filter='none';g.putImageData(out,0,0);return new THREE.CanvasTexture(c)}
function heightToNormal(c,k){const g=c.getContext('2d'),W=c.width,H=c.height,src=g.getImageData(0,0,W,H).data,out=g.createImageData(W,H),o=out.data,h=(x,y)=>src[(((y+H)%H)*W+((x+W)%W))*4]/255;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const dx=(h(x-1,y)-h(x+1,y))*k,dy=(h(x,y+1)-h(x,y-1))*k,l=Math.hypot(dx,dy,1),i=(y*W+x)*4;o[i]=(dx/l*.5+.5)*255;o[i+1]=(dy/l*.5+.5)*255;o[i+2]=(1/l*.5+.5)*255;o[i+3]=255}
 const n=canvas(W,H);n.getContext('2d').putImageData(out,0,0);const t=new THREE.CanvasTexture(n);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t}
function pillowMaps(){ // 드럼 벽: 볼록한 쿠션 셀 + 셀 사이 타공 (문 열린 사진 참고)
 const N=512,n=8,cs=N/n,hc=canvas(N,N),g=hc.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,N,N);g.filter='blur(3px)';
 for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=i*cs,y=j*cs,r=g.createRadialGradient(x+cs/2,y+cs/2,2,x+cs/2,y+cs/2,cs*.5);r.addColorStop(0,'#fff');r.addColorStop(.75,'#8a8a8a');r.addColorStop(1,'#222');g.fillStyle=r;g.beginPath();g.roundRect(x+5,y+5,cs-10,cs-10,cs*.3);g.fill()}
 g.filter='none';
 const cc=canvas(N,N),c=cc.getContext('2d');c.fillStyle='#c6cbd0';c.fillRect(0,0,N,N);
 c.fillStyle='#22262a';for(let j=0;j<n;j++)for(let i=0;i<n;i++){const x=i*cs,y=j*cs;for(const [a,b] of [[0,0],[.5,0],[0,.5],[.5,.5]])if(a!==.5||b!==.5){c.beginPath();c.arc(x+a*cs,y+b*cs,3.2,0,7);c.fill()}
  for(const [a,b] of [[.5,.28],[.5,.72],[.28,.5],[.72,.5]]){c.beginPath();c.arc(x+a*cs,y+b*cs,2.4,0,7);c.fill()}}
 const col=new THREE.CanvasTexture(cc);col.colorSpace=THREE.SRGBColorSpace;col.wrapS=col.wrapT=THREE.RepeatWrapping;col.anisotropy=8;
 return{col,nrm:heightToNormal(hc,5)}}
function backTex(){ // 드럼 뒷판: 동심원 타공
 const N=1024,c=canvas(N,N),g=c.getContext('2d');g.fillStyle='#c4c9ce';g.fillRect(0,0,N,N);g.fillStyle='#24282c';
 for(let r=70;r<500;r+=17){const n=Math.floor(2*Math.PI*r/15),s=2.6+r/500*2;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+(r%2)*.05;g.beginPath();g.arc(N/2+Math.cos(a)*r,N/2+Math.sin(a)*r,s,0,7);g.fill()}}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t}
function perfTex(){ // 드럼 타공
 const c=canvas(512,512),g=c.getContext('2d');g.fillStyle='#c9ced3';g.fillRect(0,0,512,512);
 for(let y=0;y<512;y+=3){g.fillStyle=`rgba(255,255,255,${Math.random()*.07})`;g.fillRect(0,y,512,1.5)}
 g.fillStyle='#2f3439';for(let y=16,r=0;y<512;y+=32,r++)for(let x=(r%2)*16+8;x<512;x+=32){g.beginPath();g.arc(x,y,4.4,0,7);g.fill()}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
function blobTex(){const c=canvas(256,256),g=c.getContext('2d'),r=g.createRadialGradient(128,128,10,128,128,128);
 r.addColorStop(0,'rgba(0,0,0,.75)');r.addColorStop(.55,'rgba(0,0,0,.35)');r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c)}

function rrPath(p,x,y,w,h,r){p.moveTo(x+r,y);p.lineTo(x+w-r,y);p.quadraticCurveTo(x+w,y,x+w,y+r);p.lineTo(x+w,y+h-r);p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);p.lineTo(x+r,y+h);p.quadraticCurveTo(x,y+h,x,y+h-r);p.lineTo(x,y+r);p.quadraticCurveTo(x,y,x+r,y);return p}
function mesh(geo,mat,{x=0,y=0,z=0,act=null,shadow=true,parent=null}={}){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;if(act){m.userData.act=act;pick.push(m)}(parent||P.root).add(m);return m}
function lathe(pts,seg=96){const g=new THREE.LatheGeometry(pts.map(([r,z])=>new THREE.Vector2(r,z)),seg);g.rotateX(Math.PI/2);return g}
